name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cargo.lock is gitignored, so a key hashed from it never changes and
      # the cache saved by the first run would be reused for every commit.
      # Hash the manifests and add the commit so each run saves a fresh
      # cache and the next one restores the newest.
      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}-
            ${{ runner.os }}-cargo-

      - name: cargo test (no features)
        run: cargo test

      # The parser is a path dependency, so the root test command does not
      # run its unit, integration or documentation tests.
      - name: Parser tests
        if: always()
        run: cargo test --manifest-path xezim-parser/Cargo.toml
